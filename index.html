<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My map</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style> body { margin: 0; } #map { position: absolute; inset: 0; } </style>
</head>
<body>
  <div id="map"></div>
  <div id="controls" style="
  position: absolute;
  top: 15px;
  left: 15px;
  z-index: 1;
  background: white;
  padding: 12px;
  border-radius: 5px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
">
  <button id="showAllButton">Show All Storefronts</button>

  <span style="display: inline-block; width: 15px;"></span>

  <input
    type="text"
    id="highlightrestaurantsTextEntry"
    placeholder="e.g. A1B 2C3"
  >

  <button id="highlightrestaurantsButton">Highlight Storefront</button>
</div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'style.json',        // the file you downloaded from Maputnik
      center: [-123.10, 49.26],    // longitude, latitude
      zoom: 11
    });
    map.addControl(new maplibregl.NavigationControl());
      map.on('load', () => {
      map.on('mouseenter', 'REST', () => {
        map.getCanvas().style.cursor = 'pointer';
      });
      map.on('mouseleave', 'REST', () => {
        map.getCanvas().style.cursor = '';
      });
    });

// Store all businesses from the GeoJSON file
var businessesByLocation = {};

fetch('https://raw.githubusercontent.com/gilroe/Exploratory_Lab_2/main/vancouver_storefronts.geojson')
  .then(response => response.json())
  .then(data => {

    // Group businesses by their coordinates
    data.features.forEach(feature => {
      const coordinates = feature.geometry.coordinates;
      const locationKey = coordinates[0].toFixed(7) + ',' + coordinates[1].toFixed(7);

      if (!businessesByLocation[locationKey]) {
        businessesByLocation[locationKey] = [];
      }

      businessesByLocation[locationKey].push(
        feature.properties['Business Name']
      );
    });

  });

// Display all business names when a point is clicked
map.on('click', 'REST', function (e) {

  const coordinates = e.features[0].geometry.coordinates;

  const locationKey = coordinates[0].toFixed(7) + ',' + coordinates[1].toFixed(7);

  const businesses = businessesByLocation[locationKey] || [];

  const popupContent = document.createElement('div');
  const list = document.createElement('ul');

  businesses.forEach(name => {
    const item = document.createElement('li');
    item.textContent = name || 'Unknown business';
    list.appendChild(item);
  });

  popupContent.appendChild(list);

  new maplibregl.Popup()
    .setLngLat(e.lngLat)
    .setDOMContent(popupContent)
    .addTo(map);
});
    map.on('load', function () {
  const showAllButton = document.getElementById(
    'showAllButton'
  );

  const highlightButton = document.getElementById(
    'highlightrestaurantsButton'
  );

  const textInput = document.getElementById(
    'highlightrestaurantsTextEntry'
  );

  // Show all buildings in their original style
  function showAllrestaurants() {
    map.setFilter('REST', null);
  }

  // Highlight buildings whose names contain the search text
  function highlightrestaurants() {
    const searchText = textInput.value.trim();

    if (!searchText) {
      showAllrestaurants();
      return;
    }

    map.setFilter('REST', [
      'match',
      ['to-string', ['get', 'Business Name']],
      [''],
      false,
      true
    ]);

    // Filter names using a case-insensitive substring match
    map.setFilter('REST', [
      'case',
      [
        '!=',
        ['index-of', searchText.toLowerCase(),
          ['downcase', ['to-string', ['get', 'Business Name']]]
        ],
        -1
      ],
      true,
      false
    ]);
  }

  showAllButton.addEventListener('click', showAllrestaurants);
  highlightButton.addEventListener('click', highlightrestaurants);

  // Allow Enter to run the search
  textInput.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
      highlightrestaurants();
    }
  });
});
  </script>
</body>
</html>
