<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My map</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style> body { margin: 0; } #map { position: absolute; inset: 0; } </style>
</head>
<body>
  <div id="map"></div>
  <div id="controls" style="
  position: absolute;
  top: 15px;
  left: 15px;
  z-index: 1;
  background: white;
  padding: 12px;
  border-radius: 5px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
">
  <button id="showAllButton">Show All Restaurants</button>

  <span style="display: inline-block; width: 15px;"></span>

  <input
    type="text"
    id="highlightrestaurantsTextEntry"
    placeholder="e.g. A1B 2C3"
  >

  <button id="highlightrestaurantsButton">Highlight Near Me</button>
</div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'style.json',        // the file you downloaded from Maputnik
      center: [-123.10, 49.26],    // longitude, latitude
      zoom: 11
    });
    map.addControl(new maplibregl.NavigationControl());
    map.on('load', function () {
  const showAllButton = document.getElementById(
    'showAllButton'
  );

  const highlightButton = document.getElementById(
    'highlightrestaurantsButton'
  );

  const buildingInput = document.getElementById(
    'highlightrestuarantsTextEntry'
  );

  // Show all buildings in their original style
  function showAllrestaurants() {
    map.setFilter('REST', null);
  }

  // Highlight buildings whose names contain the search text
  function highlightrestaurants() {
    const searchText = buildingInput.value.trim();

    if (!searchText) {
      showAllrestaurants();
      return;
    }

    map.setFilter('REST', [
      'match',
      ['to-string', ['get', 'Business Name']],
      [''],
      false,
      true
    ]);

    // Filter names using a case-insensitive substring match
    map.setFilter('REST', [
      'case',
      [
        '!=',
        ['index-of', searchText.toLowerCase(),
          ['downcase', ['to-string', ['get', 'Business Name']]]
        ],
        -1
      ],
      true,
      false
    ]);
  }

  showAllButton.addEventListener('click', showAllBuildings);
  highlightButton.addEventListener('click', highlightBuildings);

  // Allow Enter to run the search
  buildingInput.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
      highlightBuildings();
    }
  });
});
  </script>
</body>
</html>
