<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My map</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style> body { margin: 0; } #map { position: absolute; inset: 0; } </style>
</head>
<body>
  <div id="map"></div>
  <div id="controls" style="
  position: absolute;
  top: 15px;
  left: 15px;
  z-index: 1;
  background: white;
  padding: 12px;
  border-radius: 5px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
">
  <button id="showAllButton">Show All Storefronts</button>

  <span style="display: inline-block; width: 15px;"></span>

  <input
    type="text"
    id="highlightrestaurantsTextEntry"
    placeholder="e.g. A1B 2C3"
  >

  <button id="highlightrestaurantsButton">Highlight Storefront</button>
</div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'style.json',        // the file you downloaded from Maputnik
      center: [-123.10, 49.26],    // longitude, latitude
      zoom: 11
    });
    map.addControl(new maplibregl.NavigationControl());
      map.on('load', () => {
      map.on('click', 'REST', onEachREST);
      map.on('mouseenter', 'REST', () => {
        map.getCanvas().style.cursor = 'pointer';
      });
      map.on('mouseleave', 'REST', () => {
        map.getCanvas().style.cursor = '';
      });
    });
function onEachREST(e) {

  const clickedCoordinates = e.features[0].geometry.coordinates;

  const allBusinesses = map.querySourceFeatures('REST', {
    filter: [
      '==',
      '$type',
      'Point'
    ]
  });

 const popupText = [...new Set(
  allBusinesses
    .filter(feature =>
      feature.geometry.coordinates[0] === clickedCoordinates[0] &&
      feature.geometry.coordinates[1] === clickedCoordinates[1]
    )
    .map(feature => feature.properties['Business Name'])
    .filter(name => name)
)];

  const popup = new maplibregl.Popup()
    .setLngLat(e.lngLat)
    .setText(popupText.join(', '))
    .addTo(map);
}
    map.on('load', function () {
  const showAllButton = document.getElementById(
    'showAllButton'
  );

  const highlightButton = document.getElementById(
    'highlightrestaurantsButton'
  );

  const textInput = document.getElementById(
    'highlightrestaurantsTextEntry'
  );

  // Show all buildings in their original style
function showAllrestaurants() {
  map.setFilter('REST', null);
}

function highlightrestaurants() {
  const searchText = textInput.value.trim().toLowerCase();

  if (!searchText) {
    showAllrestaurants();
    return;
  }

  // Find restaurants matching the search
  const matchingRestaurants = map.querySourceFeatures('REST')
    .filter(feature =>
      feature.properties['Business Name'] &&
      feature.properties['Business Name'].toLowerCase().includes(searchText)
    );

  // Filter the map to show matching restaurants
  map.setFilter('REST', [
    '!=',
    -1,
    [
      'index-of',
      searchText,
      ['downcase', ['to-string', ['get', 'Business Name']]]
    ]
  ]);

  // Create a popup for every matching restaurant
  matchingRestaurants.forEach(restaurant => {
    new maplibregl.Popup()
      .setLngLat(restaurant.geometry.coordinates)
      .setText(restaurant.properties['Business Name'])
      .addTo(map);
  });
}
  showAllButton.addEventListener('click', showAllrestaurants);
  highlightButton.addEventListener('click', highlightrestaurants);

  // Allow Enter to run the search
  textInput.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
      highlightrestaurants();
    }
  });
});
  </script>
</body>
</html>
