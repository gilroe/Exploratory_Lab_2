<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My map</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style>
    body {margin: 0;}
    #map { position: absolute;inset: 0; }
  /* css for legend  created in body */
#legend {
  position: absolute;
  bottom: 30px;
  right: 10px;
  background: white;
  padding: 12px;
  border-radius: 5px;
  box-shadow: 0 1px 5px rgba(0,0,0,0.3);
  font-family: Arial, sans-serif;
  font-size: 12px;
  line-height: 1.6;
  z-index: 1;
}
  </style>
</head>
<body>

  <div id="map"></div>
<!-- style for buttons/legend -->
  <div id="controls" style="
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 1;
    background: white;
    padding: 12px;
    border-radius: 5px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  ">
    <!-- creates title for map -->
    <h2 style="margin: 0 0 10px 0;"> The Spatial Distribution of Vancouver's Restaurant Storefronts</h2>
<!-- creates showAlldata button -->
    <button id="showAllButton">Show All Storefronts</button>
<!-- creates the highlight text entry box and button -->
    <span style="display: inline-block; width: 15px;"></span>
    <input
      type="text"
      id="highlightrestaurantsTextEntry"
      placeholder="Enter business name"
    >
    <button id="highlightrestaurantsButton">Find Storefront</button>
  </div>
<!-- creates legend ffor chlorepleth map, colors match from style.json -->
  <div id="legend">
  <b>Restaurant Density</b><br>
  Storefronts per 1,000 residents<br><br>
  <span style="color: #ffffcc;">■</span> 0-4<br>
  <span style="color: #c2e699",;">■</span> 5-14<br>
  <span style="color: #78c679;">■</span> 15-24<br>
  <span style="color: #31a354;">■</span> 25-34<br>
  <span style="color: #006837;">■</span> 35+
</div>
  <script>

    // variable for popup after search
    var searchPopup = null;
    //variable array, stores restaurant data from geojson
    var allRestaurants = []   
    // Create the map
    const map = new maplibregl.Map({
      container: 'map',
      style: 'style.json',
      center: [-123.10, 49.26],
      zoom: 11
    });

    map.addControl(new maplibregl.NavigationControl());


    // Load map 
    map.on('load', () => {

      // Click on a restaurant in the normal map
      map.on('click', 'REST', onEachREST);
//change cursor when entering circle 'hitbox'
      map.on('mouseenter', 'REST', () => {
        map.getCanvas().style.cursor = 'pointer';
      });
//change cursor back when leaving circle 'hitbox'
      map.on('mouseleave', 'REST', () => {
        map.getCanvas().style.cursor = '';
      });

    });


    // Popup when clicking a restaurant (when all restaruants are shown)
    //code from class slides
    function onEachREST(e) {

      const clickedCoordinates = e.features[0].geometry.coordinates;  //selects first feature in the array and finds the point coordinates
      const allBusinesses = map.querySourceFeatures('REST', {      // search REST for point feature with clicked coordinates
        filter: [ '==', '$type','Point']
      });

      const popupText = [...new Set(     // base code from class and modified with help from MapLibre github repo
        allBusinesses
          .filter(feature =>
            feature.geometry.coordinates[0] === clickedCoordinates[0] &&    //finds other businesses with the EXACT same coordinates
            feature.geometry.coordinates[1] === clickedCoordinates[1]        // tells pop up how many features will be included
          )
          .map(feature => feature.properties['Business Name'])
          .filter(name => name)
      )];

      new maplibregl.Popup()
        .setLngLat(e.lngLat)
        .setText(popupText.join(', '))  //joins businesses with ',' on one popup  // W3Schools
        .addTo(map);

    }


    // Search by restaurant name
    //code from class slides
    map.on('load', async function () {
// connects buttons to code
      const showAllButton = document.getElementById('showAllButton');

      const highlightButton = document.getElementById('highlightrestaurantsButton');

      const textInput = document.getElementById('highlightrestaurantsTextEntry');
      
  // loads the storefronts into the variable above and creates an array of all the storefronts
  //  array implemented with help from W3schools
      const response = await fetch('https://raw.githubusercontent.com/gilroe/Exploratory_Lab_2/refs/heads/main/restreal.geojson');

      const data = await response.json();

      allRestaurants = data.features;
  
      // Show all storefronts
      //code from class slides
      function showAllrestaurants() {

        //this allows the clustering layer to be visible and hides the layer used to search restaurants
        map.setLayoutProperty('REST', 'visibility', 'visible');
        map.setLayoutProperty('RESTREAL', 'visibility', 'none');

        // reset search filter
        map.setFilter('RESTREAL', null);

        // Remove the popup created by the search
        if (searchPopup) {
          searchPopup.remove();
          searchPopup = null;
        }

      }


      // Search for a storefront
      //code from class slides
      function highlightrestaurants() {
        const searchText = textInput.value.trim().toLowerCase();
//if nothing in search it shows clustering layer (runs showAllrestaurants)
        if (!searchText) {
          showAllrestaurants();
          return;
        }

        // Find matching restaurants in the array of data
        const matchingRestaurants = allRestaurants.filter(feature =>
        feature.properties['Business Name'] &&
        String(feature.properties['Business Name'])
        .toLowerCase()
        .includes(searchText)
        );

        // remove search popup if still there
        if (searchPopup) {
          searchPopup.remove();
          searchPopup = null;
        }
        // check if restaurants match (if not github returns message)
        if (matchingRestaurants.length === 0) {
          alert('No storefronts found.');   //alert function was a cool addition i saw when doing research
          return;
        }

 // reverses the visibility, clustering layer hidden and search layer becomes visible
        map.setLayoutProperty('REST', 'visibility', 'none');
        map.setLayoutProperty('RESTREAL', 'visibility', 'visible');

        // Filter search layer to show matching storefronts
        map.setFilter('RESTREAL', [
          '!=',
          -1,
          [
            'index-of',
            searchText,
            ['downcase', ['to-string', ['get', 'Business Name']]]
          ]
        ]);

        //collect coordinates of the first matching restaurant and zoom to it
        //flyto saw in github repo very easy to implement in this project and adds a lot to the search function
        const coordinates = matchingRestaurants[0].geometry.coordinates;
        map.flyTo({
          center: coordinates,
          zoom: 16,
          speed: 1.2
        });
        // create a popup of the matching restaurants (all matching restaurants displayed on the popup)
        const restaurantNames = matchingRestaurants.map(feature =>
          feature.properties['Business Name']
        );
        searchPopup = new maplibregl.Popup()
          .setLngLat(coordinates)
          .setText(restaurantNames.join(' | '))
          .addTo(map);
      }
      
      // click allows button functions to run
      showAllButton.addEventListener('click', showAllrestaurants);
      highlightButton.addEventListener('click', highlightrestaurants);
      // enter allows button functions to run
      textInput.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
          highlightrestaurants();
        }
      });
    });
  </script>

</body>
</html>
